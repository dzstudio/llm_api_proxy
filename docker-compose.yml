version: "3.8"

services:
  llm-api-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-api-proxy
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/data/app.db
      - LOGGING_FILE_PATH=/app/logs
