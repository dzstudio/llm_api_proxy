services:
  llm-api-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-api-proxy
    ports:
      - "8088:8088"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backend/dist:/app/backend/dist
      - ./frontend/dist:/app/frontend/dist
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/app.db?connection_limit=1
      - PORT=8088
      - JWT_SECRET=${JWT_SECRET:-llm-api-proxy-dev-secret-change-me}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-24h}
      - ADMIN_DEFAULT_USERNAME=${ADMIN_DEFAULT_USERNAME:-admin}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-welcome123}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
